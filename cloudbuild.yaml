# Google Cloud Build configuration for Pizza Pizza Hot & Fresh
steps:
  # 1. Build Docker image with Google Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pizza-pizza-app:$COMMIT_SHA', '.']

  # 2. Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pizza-pizza-app:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pizza-pizza-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pizza-pizza-app:$COMMIT_SHA'
      - '--region'
      - 'asia-south1' # Mumbai, India (closest to Dehradun)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/pizza-pizza-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
